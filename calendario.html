<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Calendario de Actividades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2744;--gold:#c9a84c;--cream:#faf7f0;--txt:#1f2937;--mut:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--txt);min-height:100vh}
header{background:var(--navy);color:#fff;padding:16px 16px 0;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
#logo{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex:none}
#logo img{width:100%;height:100%;object-fit:contain}
.brand h1{font-family:'Playfair Display',serif;font-size:1.25rem;line-height:1.2;text-align:left}
.brand small{display:block;color:var(--gold);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.tabs{display:flex;justify-content:center;gap:4px}
.tab{background:none;border:none;color:rgba(255,255,255,.7);padding:10px 20px;font:500 .9rem Inter,sans-serif;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:14px 10px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bar h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--navy);text-align:center;flex:1}
.nb{background:#fff;border:1px solid #e5e7eb;border-radius:999px;width:38px;height:38px;font-size:1rem;cursor:pointer;color:var(--navy)}
.hoy{background:var(--navy);color:#fff;border:none;border-radius:999px;padding:8px 14px;font:500 .78rem Inter,sans-serif;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#e5e7eb;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.hd{background:var(--navy);color:#fff;text-align:center;font-size:.7rem;padding:7px 0;font-weight:500}
.day{background:#fff;min-height:84px;padding:3px;cursor:pointer;overflow:hidden}
.day.out{background:#f3f4f6;cursor:default}
.day.today{background:#fff8e1;box-shadow:inset 0 0 0 2px var(--gold)}
.num{font-size:.75rem;font-weight:600;color:var(--navy);margin-bottom:2px}
.fer{font-size:.54rem;color:#b91c1c;line-height:1.1;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev{color:#fff;font-size:.62rem;padding:1px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:.6rem;color:var(--mut);font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.74rem;color:var(--mut)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ag h3{font-family:'Playfair Display',serif;color:var(--navy);font-size:1rem;margin:18px 0 6px;text-transform:capitalize}
.ag h3 span{font:500 .72rem Inter,sans-serif;color:#b91c1c;margin-left:6px;text-transform:none}
.it{background:#fff;border-left:5px solid var(--navy);border-radius:10px;padding:10px 14px;margin-bottom:6px;box-shadow:0 2px 8px rgba(26,39,68,.06)}
.it b{display:block;font-size:.95rem}
.it small{color:var(--mut);font-size:.8rem}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet h3{font-family:'Playfair Display',serif;color:var(--navy);text-transform:capitalize;margin-bottom:10px}
.sheet button.x{width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:var(--navy);color:#fff;font:500 .9rem Inter,sans-serif;cursor:pointer}
footer{text-align:center;color:var(--mut);font-size:.72rem;padding:0 10px 24px}
.hide{display:none}
@media(max-width:640px){.day{min-height:62px;padding:2px}.ev{font-size:.56rem;padding:1px 3px}.fer{display:none}.brand h1{font-size:1.05rem}}
</style>
</head>
<body>
<header>
  <div class="brand"><div id="logo">✝</div><div><h1 id="titulo">Calendario de Actividades</h1><small id="sub">Iglesia Salem</small></div></div>
  <div class="tabs"><button class="tab on" id="t-cal" onclick="vista('cal')">🗓️ Calendario</button><button class="tab" id="t-ag" onclick="vista('ag')">📋 Próximas</button></div>
</header>
<main>
  <div id="v-cal">
    <div class="bar"><button class="nb" onclick="mes(-1)" aria-label="Mes anterior">‹</button><h2 id="mes-t"></h2><button class="nb" onclick="mes(1)" aria-label="Mes siguiente">›</button></div>
    <div style="text-align:center;margin-bottom:10px"><button class="hoy" onclick="irHoy()">Ir a hoy</button></div>
    <div class="grid" id="grid"></div>
    <div class="leg" id="leg"></div>
  </div>
  <div id="v-ag" class="ag hide"></div>
  <div class="empty hide" id="msg"></div>
</main>
<footer id="foot"></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA1-kOC9d4VMwe1Nt_r83_Y-8yc6cbfpB4",
  authDomain: "iglesia-salem-patzun.firebaseapp.com",
  projectId: "iglesia-salem-patzun",
  storageBucket: "iglesia-salem-patzun.firebasestorage.app",
  messagingSenderId: "89919256549",
  appId: "1:89919256549:web:45522480d047659b7de10c"
});
const db = getFirestore(app);

const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const PALETA=['#1a2744','#0f766e','#7c3aed','#be123c','#b45309','#0369a1','#4d7c0f','#a21caf'];
const p2=n=>String(n).padStart(2,'0');
const fstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const sumDias=(f,n)=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return fstr(d);};
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const colorDe=a=>{const k=a.tipo||'';if(!k)return PALETA[0];let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return PALETA[h%PALETA.length];};
const hora=h=>{if(!h)return '';const [H,M]=h.split(':').map(Number);const s=H>=12?'pm':'am';return ((H%12)||12)+':'+p2(M)+' '+s;};
const rango=a=>a.hi?(hora(a.hi)+(a.hf?' – '+hora(a.hf):'')):'';
const fl=f=>new Date(f+'T12:00:00').toLocaleDateString('es-GT',{weekday:'long',day:'numeric',month:'long'});

// Feriados de Guatemala
function pascua(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia);}
const FF={'01-01':'Año Nuevo','05-01':'Día del Trabajo','06-30':'Día del Ejército','08-15':'Asunción','09-15':'Independencia','10-20':'Revolución de 1944','11-01':'Todos los Santos','12-24':'Nochebuena (medio día)','12-25':'Navidad','12-31':'Fin de año (medio día)'};
function feriadoDe(f){const y=+f.slice(0,4),p=pascua(y),m={};[[-3,'Jueves Santo'],[-2,'Viernes Santo'],[-1,'Sábado Santo']].forEach(([d,n])=>{const x=new Date(p);x.setDate(p.getDate()+d);m[fstr(x)]=n;});return m[f]||FF[f.slice(5)]||'';}

let acts=[], hoyD=new Date(), anio=hoyD.getFullYear(), mesN=hoyD.getMonth();

function aplicarTema(d){
  const r=document.documentElement.style;
  if(d.navy)r.setProperty('--navy',d.navy);
  if(d.gold)r.setProperty('--gold',d.gold);
  if(d.titulo){document.getElementById('titulo').textContent=d.titulo;document.title=d.titulo;}
  if(d.subtitulo)document.getElementById('sub').textContent=d.subtitulo;
  const lg=document.getElementById('logo');
  if(d.logoData&&/^data:image\//.test(d.logoData))lg.innerHTML='<img alt="" src="'+d.logoData+'">';
  else lg.textContent=d.emoji||'✝';
}
function delDia(f){return acts.filter(a=>f>=a.fi&&f<=(a.ff||a.fi)).sort((x,y)=>(x.hi||'99').localeCompare(y.hi||'99'));}

function renderCal(){
  document.getElementById('mes-t').textContent=MESES[mesN]+' '+anio;
  const primer=new Date(anio,mesN,1),ult=new Date(anio,mesN+1,0),off=(primer.getDay()+6)%7,hoy=fstr(new Date());
  let h=DIAS.map(d=>`<div class="hd">${d}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="day out"></div>';
  for(let d=1;d<=ult.getDate();d++){
    const f=anio+'-'+p2(mesN+1)+'-'+p2(d),L=delDia(f),fer=feriadoDe(f);
    h+=`<div class="day${f===hoy?' today':''}" onclick="abrirDia('${f}')"><div class="num">${d}</div>${fer?`<div class="fer">🇬🇹 ${esc(fer)}</div>`:''}`
      +L.slice(0,3).map(a=>`<div class="ev" style="background:${colorDe(a)}">${esc((a.hi?hora(a.hi).replace(' ','')+' ':'')+a.nombre)}</div>`).join('')
      +(L.length>3?`<div class="more">+${L.length-3} más</div>`:'')+'</div>';
  }
  const rest=(7-((off+ult.getDate())%7))%7;
  for(let i=0;i<rest;i++)h+='<div class="day out"></div>';
  document.getElementById('grid').innerHTML=h;
  const ini=anio+'-'+p2(mesN+1)+'-01',fin=anio+'-'+p2(mesN+1)+'-31';
  const tp=[...new Set(acts.filter(a=>a.fi<=fin&&(a.ff||a.fi)>=ini).map(a=>a.tipo).filter(Boolean))];
  document.getElementById('leg').innerHTML=tp.map(t=>`<span><i style="background:${colorDe({tipo:t})}"></i>${esc(t)}</span>`).join('');
}
function itemHTML(a){
  const meta=[rango(a),a.lugar].filter(Boolean).join(' · ');
  const multi=a.ff&&a.ff!==a.fi?` <small>(${esc(fl(a.fi))} al ${esc(fl(a.ff))})</small>`:'';
  return `<div class="it" style="border-left-color:${colorDe(a)}"><b>${esc(a.nombre)}</b>${meta?`<small>${esc(meta)}</small>`:''}${multi}${a.tipo?`<br><small>${esc(a.tipo)}</small>`:''}</div>`;
}
function renderAg(){
  const hoy=fstr(new Date()),fin=sumDias(hoy,90);
  const L=acts.filter(a=>(a.ff||a.fi)>=hoy&&a.fi<=fin).sort((x,y)=>(x.fi+(x.hi||'')).localeCompare(y.fi+(y.hi||'')));
  let ult='',h='';
  L.forEach(a=>{const f=a.fi<hoy?hoy:a.fi,fer=feriadoDe(f);
    if(f!==ult){ult=f;h+=`<h3>${esc(fl(f))}${fer?`<span>🇬🇹 ${esc(fer)}</span>`:''}</h3>`;}
    h+=itemHTML(a);});
  document.getElementById('v-ag').innerHTML=h||'<div class="empty">No hay actividades programadas en los próximos 90 días.</div>';
}
window.abrirDia=f=>{
  const L=delDia(f),fer=feriadoDe(f);
  const o=document.createElement('div');o.className='sheet-bg';
  o.onclick=e=>{if(e.target===o)o.remove();};
  o.innerHTML=`<div class="sheet"><h3>${esc(fl(f))}</h3>${fer?`<p style="color:#b91c1c;font-size:.82rem;margin-bottom:8px">🇬🇹 ${esc(fer)}</p>`:''}${L.length?L.map(itemHTML).join(''):'<p style="color:#6b7280">Sin actividades este día.</p>'}<button class="x">Cerrar</button></div>`;
  o.querySelector('.x').onclick=()=>o.remove();
  document.body.appendChild(o);
};
window.mes=n=>{mesN+=n;if(mesN<0){mesN=11;anio--;}if(mesN>11){mesN=0;anio++;}renderCal();};
window.irHoy=()=>{const h=new Date();anio=h.getFullYear();mesN=h.getMonth();renderCal();};
window.vista=v=>{
  document.getElementById('v-cal').classList.toggle('hide',v!=='cal');
  document.getElementById('v-ag').classList.toggle('hide',v!=='ag');
  document.getElementById('t-cal').classList.toggle('on',v==='cal');
  document.getElementById('t-ag').classList.toggle('on',v==='ag');
};

async function cargar(){
  try{
    const sn=await getDoc(doc(db,'publico','calendario'));
    if(!sn.exists()){mostrarMsg('El calendario aún no ha sido publicado.');return;}
    const d=sn.data();
    aplicarTema(d);
    acts=(d.acts||[]).filter(a=>a&&a.nombre&&a.fi);
    if(d.actualizado)document.getElementById('foot').textContent='Actualizado el '+new Date(d.actualizado).toLocaleDateString('es-GT',{day:'numeric',month:'long',year:'numeric'});
    renderCal();renderAg();
  }catch(e){
    console.error(e);
    mostrarMsg('No se pudo cargar el calendario. Revisa tu conexión e intenta de nuevo.');
  }
}
function mostrarMsg(t){
  document.getElementById('v-cal').classList.add('hide');
  document.querySelector('.tabs').classList.add('hide');
  const m=document.getElementById('msg');m.textContent=t;m.classList.remove('hide');
}
cargar();
// Si la persona vuelve a la pestaña después de un rato, recargar datos
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&acts.length)cargar();});
</script>
</body>
</html>
